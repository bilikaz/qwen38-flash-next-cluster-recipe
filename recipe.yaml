# The one and only model config. run.sh reads THIS — the boxes themselves live in cluster.env (written by
# setup.sh on first run, machine-specific, never committed).
# Flag mapping: `name: value` -> --name value | `name: true` -> --name | `name: false` -> omitted.
# Cluster flags (--nnodes 2 --node-rank N --master-addr/--master-port --tensor-parallel-size 2 --headless on the
# worker) and the per-box NCCL/gloo interface pins are added by run.sh from cluster.env — never put them here.

server:
  image: myllmbox/qwen38-flash-next-cluster-vllm:v6   # pinned public tag (digest in README) = vLLM 0.30.0 (vllm/vllm-openai)
                                                      # + patches: the NVFP4 n-gram table on 0.30's embedding plugin; the
                                                      # 4-bit output head (hibrid48) — stock 0.30 cannot load either; the
                                                      # fused multi-step MTP draft (= vllm-project/vllm#58449); QSA rope
                                                      # clamp; loader page-cache drop. v3 (vLLM 0.29, image v5) = `git checkout v3`
  cpuset: "5-9,15-19"                           # the GB10's 10 Cortex-X925 3.9GHz cores (0-4,10-14 are
                                                # 2.8GHz A725) — measured +2-3% at every concurrency
  model: myllmbox/Qwen3.8-Flash-Next-hibrid48   # HF repo — downloaded into ./models on first run (~99G),
                                                # then synced to the worker at the SAME absolute path.
                                                # = hibrid47 + the output head as NVFP4: 22 engine steps/s (was 17.7)
  # model: myllmbox/Qwen3.8-Flash-Next-hibrid48-uncensored   # the abliterated body (OrcaRouter) with the same head, 98G:
                                                # no refusals, NO guardrails — research / red-teaming / private use behind your
                                                # own moderation. GATED on Hugging Face: accept its agreement, then hf auth login
                                                # or export HF_TOKEN (run.sh checks). Nothing else in this file changes. Set
                                                # served-model-name to Qwen/Qwen3.8-Flash-Next-Uncensored if you run both.
  port: 8000                                    # OpenAI API on the head box
  host: 127.0.0.1                               # the cluster runs on host networking — 127.0.0.1 keeps the API
                                                # local; set 0.0.0.0 to expose it on the LAN
  master_port: 25000                            # torch.distributed rendezvous, on the interconnect
  models_dir: ./models
  cache_dir: ./cache                            # compile/autotune caches (per box); deletable, first boot rebuilds

env:
  # The n-gram (PLE) table is an ordinary GPU parameter in hibrid47/48 — no offload worker.
  MBX_FUSED_DRAFT: "1"
  MBX_PLE_REPLICATE: "0"                        # HALF the table per box (14.3G), exchanged per gather. On vLLM 0.30 this
                                                # measured the SAME speed as the full table per box at 1/16/32 concurrent
                                                # (it was slower on 0.29) and frees 13.4G per box → the 41G KV pin below.
                                                # "1" = the full table on each box (then drop kv-cache-memory back to 28G)
  # No OMP_NUM_THREADS: vLLM sizes its threads itself (many for the load, one for serving); a fixed value hurts one phase.
  PYTHONUNBUFFERED: "1"                         # rank-1 load progress actually shows in docker logs
  TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
  TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC: "180"       # die in 3 min on a stuck collective instead of hanging 30
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"               # Marlin small-N fast path (self-gating)
  TORCH_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_CUDA_ARCH_LIST: "12.1a"
  # RoCE v2 over the ConnectX link (NCCL_SOCKET_IFNAME / NCCL_IB_HCA / GLOO_SOCKET_IFNAME / VLLM_HOST_IP are
  # per box and come from cluster.env). Validated set: RDMA port counters moving, TCP path flat.
  NCCL_IB_GID_INDEX: "3"
  NCCL_IB_ROCE_VERSION_NUM: "2"
  NCCL_IB_ADDR_FAMILY: "AF_INET"
  NCCL_CROSS_NIC: "1"
  NCCL_IGNORE_CPU_AFFINITY: "1"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_NVLS_ENABLE: "0"
  NCCL_MAX_NCHANNELS: "4"                       # NCCL builds 64 channels here and splits every large message across all of
                                                # them; with no GPUDirect RDMA on the GB10 each piece is copied through host
                                                # memory, so 4 is faster: +10 % tok/s at 32 concurrent, +7 % at 64, same at 1

vllm:
  served-model-name: Qwen/Qwen3.8-Flash-Next
  engram-config: '{"cpu_offload": false}'      # vLLM 0.30 defaults to keeping the n-gram table in pinned host memory; this
                                                # image serves it from the GPU (the layout every number was measured on)
  gdn-prefill-backend: flashinfer               # +5 % prefill over triton from 8k to 256k tokens, same decode speed
  moe-backend: marlin                           # fastest MoE kernel for NVFP4 W4A16 on the GB10 (+5 % steps over
                                                # flashinfer_cutlass; the b12x backend crashed on prefix-cached long prompts)
  pipeline-parallel-size: 1                     # TP only (TP=2 is set by run.sh = box count)
  distributed-executor-backend: mp              # no Ray
  gpu-memory-utilization: 0.70                  # with kv-cache-memory pinned this does not size the KV pool (verified:
                                                # 65G of weights + the pin boot fine at 0.70)
  kv-cache-memory: "41000000000"                # 41G per box = 2,500,128 pooled KV tokens in bf16 (9.5× the 262K window; KV
                                                # is split across the two boxes) — paid for by the half table above. Leaves
                                                # ~6G host headroom on the head box after graph capture; do not take vLLM's
                                                # "fully utilize" figure. (fp8 KV is not available in this image.)
  compilation-config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[1,2,4,6,8,12,16,18,24,30,32,36,48,60,64,72,96,120,128,144,192,240,256,288,336,384],"compile_ranges_endpoints":[32]}'
                                                # the engine rounds each full-graph size UP to a multiple of K+1 (=6) and
                                                # drops sizes past the largest listed → the list must reach seats×6 = 384,
                                                # or every concurrency above it decodes without graphs
  block-size: 1632                              # needed for K=5: the attention ring (12 slots) must divide the block size;
                                                # the automatic 1616 does not, 1632 does (drop this line if you go back to K=4)
  load-format: fastsafetensors                  # the loader every boot figure below was measured with (weights in ~97 s,
                                                # the whole boot ~4 min); remove for vLLM's default safetensors loader
  max-model-len: 262144                         # the model's native max
  max-num-seqs: 64                              # 64 seats × ~38k tokens of pool each (2.45M / 64). With K=5 each running request
                                                # pins more pool at admission (the model's GDN recurrent state + the longer draft
                                                # ring): 64 long answers fill the pool after ~3 min and requests start to queue.
                                                # 48 keeps headroom (~75 % at 48 pasture-length streams)
  max-num-batched-tokens: 8192                  # also the image-input encoder budget — keep for image requests
                                                # (4096 made 0.29 add a compile range that crashed the MoE profile run)
  enable-prefix-caching: true
  enable-auto-tool-choice: true
  tool-call-parser: qwen3_xml
  reasoning-parser: qwen3
  speculative-config: '{"method":"mtp","num_speculative_tokens":5,"rejection_sample_method":"block","draft_sample_method":"probabilistic"}'
                                                # K=5 drafts, sampled from the drafter (probabilistic) and verified as a block:
                                                # 5.1 of 6 accepted on code, ~3.9 on thinking-on requests. Measured vs K=4:
                                                # 1 stream 92 → 107 tok/s (thinking on 76 → 81, peak 108 → 121), 32 streams
                                                # 595 → 644, 64 streams 741 → 808 (861 peak)
  async-scheduling: true                        # +9-12% at c=4-5, neutral at 8+
