# The one and only model config. run.sh reads THIS — the boxes themselves live in cluster.env (written by
# setup.sh on first run, machine-specific, never committed).
# Flag mapping: `name: value` -> --name value | `name: true` -> --name | `name: false` -> omitted.
# Cluster flags (--nnodes 2 --node-rank N --master-addr/--master-port --tensor-parallel-size 2 --headless on the
# worker) and the per-box NCCL/gloo interface pins are added by run.sh from cluster.env — never put them here.

server:
  image: myllmbox/qwen38-flash-next-cluster-vllm:v4   # pinned public tag (digest in README) = the v1 serving image +
                                                      # four patches: the NVFP4 n-gram table as a resident GPU
                                                      # parameter (hibrid47); fp8 KV on the QSA path (upstream PR
                                                      # #54846 ported); loader drops each shard from the page cache
                                                      # once consumed; the int3/offload path kept as fallback
  cpuset: "5-9,15-19"                           # the GB10's 10 Cortex-X925 3.9GHz cores (0-4,10-14 are
                                                # 2.8GHz A725) — measured +2-3% at every concurrency
  model: myllmbox/Qwen3.8-Flash-Next-hibrid47   # HF repo — downloaded into ./models on first run (~99G),
                                                # then synced to the worker at the SAME absolute path
  port: 8000                                    # OpenAI API on the head box
  host: 127.0.0.1                               # the cluster runs on host networking — 127.0.0.1 keeps the API
                                                # local; set 0.0.0.0 to expose it on the LAN
  master_port: 25000                            # torch.distributed rendezvous, on the interconnect
  models_dir: ./models
  cache_dir: ./cache                            # compile/autotune caches (per box); deletable, first boot rebuilds

env:
  # The n-gram (PLE) table is an ordinary GPU parameter in hibrid47 — no offload worker.
  MBX_PLE_REPLICATE: "1"                        # the FULL table on each box (28.6G, no per-step exchange) — the
                                                # layout every v2 number was measured on. Unset = half per box
                                                # (14G less per box → room for a 40G KV pin; steps within 1 %)
  OMP_NUM_THREADS: "8"                          # matched to the 10-core pin
  MBX_VOCAB_GEMV: "1"                           # measured +5.5% steps
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"               # Marlin small-N fast path (self-gating)
  TORCH_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_CUDA_ARCH_LIST: "12.1a"
  # RoCE v2 over the ConnectX link (NCCL_SOCKET_IFNAME / NCCL_IB_HCA / GLOO_SOCKET_IFNAME / VLLM_HOST_IP are
  # per box and come from cluster.env). Validated set: RDMA port counters moving, TCP path flat.
  NCCL_IB_GID_INDEX: "3"
  NCCL_IB_ROCE_VERSION_NUM: "2"
  NCCL_IB_ADDR_FAMILY: "AF_INET"
  NCCL_CROSS_NIC: "1"
  NCCL_IGNORE_CPU_AFFINITY: "1"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_NVLS_ENABLE: "0"

vllm:
  served-model-name: Qwen/Qwen3.8-Flash-Next
  pipeline-parallel-size: 1                     # TP only (TP=2 is set by run.sh = box count)
  distributed-executor-backend: mp              # required — PLE worker spawn; no Ray
  gpu-memory-utilization: 0.70                  # with kv-cache-memory pinned this does not size the KV pool (verified:
                                                # 65G of weights + the pin boot fine at 0.70)
  kv-cache-memory: "28000000000"                # 28G per box = 2.85M pooled KV tokens in fp8 (1.71M was bf16; KV is
                                                # split across the two boxes). Leaves ~5G host headroom per box after
                                                # graph capture — do not take vLLM's "fully utilize" figure
  kv-cache-dtype: fp8                           # v2.1: fp8_e4m3 KV on the QSA path (image patch 04). 1.66× the tokens
                                                # on the same pin; the GDN state stays as the model ships it
  max-model-len: 262144                         # the model's native max
  max-num-seqs: 32                              # 32 seats × ~89k tokens of pool each (2.85M / 32), 17 tok/s per
                                                # stream. Each running request also pins ~1.9 % of the pool at
                                                # admission (the model's GDN recurrent state, 36 layers × (2+K)
                                                # blocks — fp8 KV does not shrink it), so ~52 is the hard ceiling;
                                                # 48 seats ran at 13 tok/s each and left ~3k tokens of pool per seat
  max-num-batched-tokens: 8192                  # also the image-input encoder budget — keep for image requests
  enable-prefix-caching: true
  enable-auto-tool-choice: true
  tool-call-parser: qwen3_xml
  reasoning-parser: qwen3
  speculative-config: '{"method":"mtp","num_speculative_tokens":4}'   # K=4: acceptance 4.2–4.6 (cap 5.0), ~8%
                                                # step cost vs K=3, net faster at every concurrency
  async-scheduling: true                        # +9-12% at c=4-5, neutral at 8+
